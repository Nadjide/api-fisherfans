services:
  api:
    build: .
    volumes:
      - .:/code
      - ./fisherfans.db:/code/fisherfans.db
    environment:
      - DATABASE_URL=sqlite:///fisherfans.db
    ports:
      - "8000:8000"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  seeder:
    build: .
    depends_on:
      api:
        condition: service_healthy
    command: python seed_db.py
    volumes:
      - .:/code
      - ./fisherfans.db:/code/fisherfans.db
    environment:
      - DATABASE_URL=sqlite:///fisherfans.db
      - BASE_URL=http://api:8000/v1

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: always

  cert-gen:
    image: alpine:latest
    volumes:
      - ./nginx/certs:/certs
    command: >
      sh -c "apk add --no-cache openssl && 
      if [ ! -f /certs/localhost.crt ]; then 
      openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /certs/localhost.key -out /certs/localhost.crt -subj '/CN=localhost';
      fi"
