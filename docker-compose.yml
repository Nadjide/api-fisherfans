services:
  api:
    build: .
    volumes:
      - .:/code
      - ./fisherfans_v2.db:/code/fisherfans_v2.db
    environment:
      - DATABASE_URL=sqlite:///fisherfans_v2.db
    ports:
      - "8000:8000"
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: always

  cert-gen:
    image: alpine:latest
    volumes:
      - ./nginx/certs:/certs
    command: >
      sh -c "apk add --no-cache openssl && 
      if [ ! -f /certs/localhost.crt ]; then 
      openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /certs/localhost.key -out /certs/localhost.crt -subj '/CN=localhost';
      fi"
